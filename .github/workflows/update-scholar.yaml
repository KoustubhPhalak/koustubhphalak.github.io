name: Update Google Scholar stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Every Monday

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Scholar fetcher
        run: pip install bibliometrics

      - name: Fetch Google Scholar metrics
        run: |
          mkdir -p _data assets

          cat > .bibliometrics.config.json <<'EOF'
          {
            "scholarID": "B36kyxIAAAAJ",
            "jsonOutputFile": "_data/scholar.json",
            "include": [
              "total-cites",
              "h-index",
              "i10-index"
            ],
            "svgConfig": [
              {
                "filename": "assets/scholar-temp.svg",
                "background": "white",
                "border": "white",
                "title": "black",
                "text": "black",
                "include": [
                  "total-cites",
                  "h-index",
                  "i10-index"
                ]
              }
            ]
          }
          EOF

          python -m bibliometrics
          rm -f assets/scholar-temp.svg

      - name: Save updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add _data/scholar.json

          if git diff --cached --quiet; then
            echo "Scholar metrics have not changed."
          else
            git commit -m "Update Google Scholar metrics"
            git push
          fi